name: .NET Microservices CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-verify:
    name: Build & Verify Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: |
          dotnet restore Services/Catalog.API/Catalog.API.csproj
          dotnet restore Services/Payment.API/Payment.API.csproj
          dotnet restore Services/AIChat.API/AIChat.API.csproj

      - name: Build Catalog.API
        run: dotnet build Services/Catalog.API/Catalog.API.csproj --configuration Release --no-restore

      - name: Build Payment.API
        run: dotnet build Services/Payment.API/Payment.API.csproj --configuration Release --no-restore

      - name: Build AIChat.API
        run: dotnet build Services/AIChat.API/AIChat.API.csproj --configuration Release --no-restore