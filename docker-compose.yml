version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: aicommerce_mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: aicommerce_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=AiCommercePayment
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: aicommerce_redis
    ports:
      - "6379:6379"
    restart: unless-stopped